name: Probe previous price (調査用・DB書き込みなし)
on:
  push:
    branches: [claude/probe-previous-price]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 今朝の初値下げ(元値を知らない商品)と、以前から追っている再値下げ商品
      - run: node scripts/probe/previous-price.mjs E489091-000:00 E489482-000:00 E486986-000:00 E488514-000:00 E487832-000:00 E492123-000:01
