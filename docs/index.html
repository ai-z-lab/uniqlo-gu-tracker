<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>UNIQLO / GU 価格トラッカー</title>
  <meta name="description" content="UNIQLO・GUの商品価格の変動履歴を記録・可視化するトラッカーです。" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏷️</text></svg>" />
  <style>
    :root {
      --bg: #f7f7f8;
      --surface: #ffffff;
      --border: #e5e5ea;
      --text: #1c1c1e;
      --text-muted: #6b6b70;
      --accent: #e4402a;
      --accent-soft: #fdecea;
      --up: #d1453b;
      --down: #1f8a4c;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.04), 0 8px 24px rgba(0, 0, 0, 0.04);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #17181a;
        --surface: #202124;
        --border: #33343780;
        --text: #f0f0f2;
        --text-muted: #a0a0a6;
        --accent: #ff6b52;
        --accent-soft: #3a2320;
        --up: #ff7a6e;
        --down: #4fd07a;
        --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.3);
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
      line-height: 1.5;
    }

    header {
      padding: 2rem 1.25rem 1rem;
      max-width: 960px;
      margin: 0 auto;
    }

    header h1 {
      margin: 0 0 0.25rem;
      font-size: 1.5rem;
      letter-spacing: -0.01em;
    }

    header p {
      margin: 0;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    main {
      max-width: 960px;
      margin: 0 auto;
      padding: 0.5rem 1.25rem 3rem;
    }

    #status {
      color: var(--text-muted);
      font-size: 0.9rem;
      padding: 1rem 0;
    }

    #status.error {
      color: var(--up);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1rem;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.1rem 1.2rem;
      box-shadow: var(--shadow);
    }

    .card .brand {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: var(--accent);
      background: var(--accent-soft);
      border-radius: 999px;
      padding: 0.15rem 0.55rem;
      margin-bottom: 0.5rem;
      text-transform: uppercase;
    }

    .card h2 {
      font-size: 1rem;
      margin: 0 0 0.15rem;
      font-weight: 600;
    }

    .card a.product-link {
      color: inherit;
      text-decoration: none;
    }

    .card a.product-link:hover {
      text-decoration: underline;
    }

    .price-row {
      display: flex;
      align-items: baseline;
      gap: 0.5rem;
      margin: 0.6rem 0 0.2rem;
    }

    .price {
      font-size: 1.6rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .delta {
      font-size: 0.8rem;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    .delta.down { color: var(--down); }
    .delta.up { color: var(--up); }

    .updated {
      color: var(--text-muted);
      font-size: 0.78rem;
      margin-bottom: 0.6rem;
    }

    canvas {
      width: 100% !important;
      height: 90px !important;
    }

    .empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 3rem 1rem;
      color: var(--text-muted);
    }

    footer {
      max-width: 960px;
      margin: 0 auto;
      padding: 1rem 1.25rem 2.5rem;
      color: var(--text-muted);
      font-size: 0.78rem;
    }

    footer a { color: inherit; }
  </style>
</head>
<body>
  <header>
    <h1>UNIQLO / GU 価格トラッカー</h1>
    <p>登録した商品の価格を毎日自動でチェックし、変動履歴を記録しています。</p>
  </header>
  <main>
    <div id="status">読み込み中…</div>
    <div id="grid" class="grid"></div>
  </main>
  <footer>
    Data updates once a day via GitHub Actions. Prices are best-effort and may not reflect the current live price.
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
