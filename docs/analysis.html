<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>周期表・値引きルールの検証 | UNIQLO / GU 価格トラッカー</title>
  <meta name="description" content="自前のスクレイプデータだけを使い、商品カテゴリ別の値下げ周期(年ごとの初動値下げ日・期間限定日)と、既知の値引きルールから外れた例外を自動で洗い出します。" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📅</text></svg>" />
  <link rel="stylesheet" href="./theme.css" />
  <style>
    /* 配色などのトークンは docs/theme.css(index.html と共用)。 */
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    header {
      padding: 2rem 1.25rem 1rem;
      max-width: 1080px;
      margin: 0 auto;
    }

    header h1 {
      margin: 0 0 0.25rem;
      font-size: 1.5rem;
      letter-spacing: -0.01em;
    }

    header p {
      margin: 0;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .page-nav {
      margin-top: 0.6rem;
      font-size: 0.85rem;
    }

    .page-nav a {
      color: var(--text-muted);
      text-decoration: none;
      border-bottom: 1px solid var(--border);
      padding-bottom: 1px;
    }

    .page-nav a:hover { color: var(--text); }

    main {
      max-width: 1080px;
      margin: 0 auto;
      padding: 0.5rem 1.25rem 3rem;
    }

    .tabs {
      display: flex;
      gap: 0.25rem;
      background: var(--tab-bg);
      padding: 0.25rem;
      border-radius: 10px;
      margin-bottom: 0.75rem;
    }

    .tabs button {
      flex: 1;
      border: 0;
      background: transparent;
      color: var(--text-muted);
      font: inherit;
      font-weight: 600;
      padding: 0.45rem 0.6rem;
      border-radius: 8px;
      cursor: pointer;
    }

    .tabs button:hover { background: var(--tab-hover); }

    .tabs button.active {
      background: var(--surface);
      color: var(--text);
      box-shadow: var(--shadow);
    }

    .brand-tabs button.active[data-brand="uniqlo"] { color: var(--brand-uniqlo); }
    .brand-tabs button.active[data-brand="gu"] { color: var(--brand-gu); }

    #status {
      padding: 1.5rem 0;
      color: var(--text-muted);
    }

    #status.error { color: var(--up); }

    .section {
      margin-bottom: 2.2rem;
    }

    .section-header {
      display: flex;
      align-items: baseline;
      gap: 0.6rem;
      margin-bottom: 0.5rem;
      padding-bottom: 0.4rem;
      border-bottom: 2px solid var(--brand-color, var(--border));
    }

    .section-header .label {
      font-size: 1.05rem;
      font-weight: 700;
    }

    .section-header .count {
      color: var(--text-muted);
      font-size: 0.8rem;
    }

    /* 数字の隣に、その数字が何を数えていないのかを置く。 */
    .note {
      color: var(--text-muted);
      font-size: 0.78rem;
      line-height: 1.6;
      margin: 0 0 0.9rem;
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: var(--shadow);
      padding: 0.9rem 1rem;
      margin-bottom: 0.9rem;
    }

    /* 横に長い表はページ全体を横スクロールさせず、表の中だけで滑らせる。 */
    .table-scroll {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      font-size: 0.82rem;
      font-variant-numeric: tabular-nums;
    }

    th, td {
      text-align: left;
      padding: 0.4rem 0.6rem;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
      vertical-align: top;
    }

    th {
      color: var(--text-muted);
      font-size: 0.75rem;
      font-weight: 700;
    }

    tbody tr:last-child td { border-bottom: 0; }

    /* 商品グループの境目。同じ商品の年ちがいの行が続くので、どこで次の商品に
       変わったのかを線で示す(2行目以降は商品名の列が空になるため)。 */
    tbody tr.group-start:not(:first-child) td {
      border-top: 2px solid var(--border);
    }

    td.num { text-align: right; }

    /* 商品グループ名の列だけは折り返す(長い商品名で表が横に伸びるため)。 */
    td.group-name {
      white-space: normal;
      min-width: 12rem;
      max-width: 20rem;
      font-weight: 600;
    }

    .category-group {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: var(--shadow);
      margin-bottom: 0.6rem;
      overflow: hidden;
    }

    .category-group > summary {
      cursor: pointer;
      padding: 0.75rem 0.9rem;
      font-weight: 700;
      font-size: 0.9rem;
      display: flex;
      align-items: baseline;
      gap: 0.6rem;
      list-style: none;
    }

    .category-group > summary::-webkit-details-marker { display: none; }

    .category-group > summary::before {
      content: "▸";
      color: var(--text-muted);
      font-size: 0.75rem;
    }

    .category-group[open] > summary::before { content: "▾"; }

    .category-group > summary .group-count {
      color: var(--text-muted);
      font-weight: 500;
      font-size: 0.78rem;
      margin-left: auto;
    }

    .category-group > .body {
      padding: 0 0.9rem 0.9rem;
    }

    /* 状態を表す小さなラベル。色だけに意味を持たせず、必ず文字も出す。 */
    .tag {
      display: inline-block;
      border-radius: 999px;
      padding: 0.05rem 0.4rem;
      font-size: 0.68rem;
      font-weight: 700;
      line-height: 1.5;
      white-space: nowrap;
    }

    .tag.unknown {
      background: var(--tab-bg);
      color: var(--text-muted);
    }

    .tag.censored {
      background: var(--tab-bg);
      color: var(--status-limited);
    }

    .tag.markdown { color: var(--status-markdown); }
    .tag.limited { color: var(--status-limited); }

    .tag.match { color: var(--down); }
    .tag.exception { color: var(--up); }
    .tag.multiple { color: var(--status-price_up); }
    .tag.unjudgeable { color: var(--text-muted); }

    .day { font-weight: 700; }
    .muted { color: var(--text-muted); }

    /* ルール1本ぶんのカード。 */
    .rule-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 4px solid var(--brand-color, var(--border));
      border-radius: 12px;
      box-shadow: var(--shadow);
      padding: 0.9rem 1rem;
      margin-bottom: 0.7rem;
    }

    .rule-card h3 {
      margin: 0 0 0.15rem;
      font-size: 0.95rem;
    }

    .rule-card .rule-sub {
      color: var(--text-muted);
      font-size: 0.78rem;
      margin-bottom: 0.6rem;
    }

    .rule-card .verdict-bar {
      display: flex;
      height: 10px;
      border-radius: 999px;
      overflow: hidden;
      background: var(--tab-bg);
      margin-bottom: 0.5rem;
    }

    .verdict-bar span { display: block; }
    .verdict-bar .match { background: var(--down); }
    .verdict-bar .multiple { background: var(--status-price_up); }
    .verdict-bar .exception { background: var(--up); }
    .verdict-bar .unjudgeable { background: var(--border); }

    .verdict-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 0.15rem 0.9rem;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .verdict-legend b { color: var(--text); font-variant-numeric: tabular-nums; }

    .empty {
      text-align: center;
      padding: 2rem 1rem;
      color: var(--text-muted);
    }

    footer {
      max-width: 1080px;
      margin: 0 auto;
      padding: 1rem 1.25rem 2.5rem;
      color: var(--text-muted);
      font-size: 0.78rem;
    }

    footer a { color: inherit; }

    @media (max-width: 640px) {
      header {
        padding: 1.1rem 0.9rem 0.6rem;
      }

      header h1 { font-size: 1.2rem; }
      header p { display: none; }

      .page-nav {
        margin-top: 0.35rem;
        font-size: 0.8rem;
      }

      main { padding: 0.4rem 0.9rem 2.5rem; }

      .tabs button {
        font-size: 0.85rem;
        padding: 0.4rem 0.5rem;
      }

      table { font-size: 0.76rem; }

      th, td { padding: 0.35rem 0.45rem; }

      td.group-name { min-width: 9rem; }
    }
  </style>
</head>
<body>
  <header>
    <h1>周期表・値引きルールの検証</h1>
    <p>
      このトラッカー自身が集めたデータだけを使って、商品グループごとの値下げ周期と、
      既知の値引きルールから外れた例外を自動で洗い出します。
    </p>
    <nav class="page-nav"><a href="./index.html">← 商品一覧のダッシュボードへ</a></nav>
  </header>
  <main>
    <div class="tabs brand-tabs" id="brand-tabs">
      <button type="button" data-brand="uniqlo">UNIQLO</button>
      <button type="button" data-brand="gu">GU</button>
    </div>
    <div class="tabs gender-tabs" id="gender-tabs">
      <button type="button" data-gender="men">MEN</button>
      <button type="button" data-gender="women">WOMEN</button>
    </div>

    <div id="status">読み込み中…</div>
    <div id="content"></div>
  </main>
  <footer>
    集計対象はこのトラッカーが巡回した範囲だけです。巡回していない期間に起きた値下げは
    記録に残らないため、「値下げが無かった」ではなく「未確認」として扱っています。
    商品グループは商品名の正規化(表記ゆれの吸収)と手動の対応付けによる推定で、
    UNIQLO/GU の公式な商品マスタではありません。
  </footer>

  <script type="module" src="./analysis.js"></script>
</body>
</html>
